<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlngelSaveMe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d0d14;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 204, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(157, 78, 221, 0.2) 0%, transparent 40%);
            animation: drift 20s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes drift {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-3%, 3%);
            }
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 0 auto;
            padding: 40px 20px 50px;
        }

        /* Hero-текст */
        .hero {
            text-align: center;
            margin-bottom: 32px;
        }

        .hero h1 {
            font-size: 1.6rem;
            line-height: 1.25;
            background: linear-gradient(90deg, #FFCC00, #FF5E62);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .hero p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Карточки-ссылки */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 50px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.09);
            transform: translateY(-2px);
            border-color: rgba(255, 204, 0, 0.3);
        }

        .card-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .card-icon.wave {
            background: linear-gradient(135deg, #FFCC00, #FF9500);
        }

        .card-icon.playlist {
            background: linear-gradient(135deg, #9D4EDD, #5E5FE6);
        }

        .card-icon.track {
            background: linear-gradient(135deg, #FF5E62, #E91E63);
        }

        .card-body {
            flex: 1;
            min-width: 0;
        }

        .card-type {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 3px;
        }

        .card-title {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.3;
            margin-bottom: 2px;
        }

        .card-desc {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-arrow {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.3rem;
            flex-shrink: 0;
            transition: transform 0.2s, color 0.2s;
        }

        .card:hover .card-arrow {
            color: #FFCC00;
            transform: translateX(3px);
        }

        /* Футер */
        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 24px;
            text-align: center;
        }

        .socials {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .social {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-size: 0.88rem;
            transition: all 0.2s;
        }

        .social:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 204, 0, 0.4);
        }

        .copyright {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.78rem;
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.4rem;
            }

            .card {
                padding: 14px;
                gap: 12px;
            }

            .card-icon {
                width: 46px;
                height: 46px;
                font-size: 1.4rem;
            }
        }

        /* Анонимная кнопка и модалка */
        .anon-btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 204, 0, 0.3);
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            text-decoration: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 50px;
        }

        .anon-btn:hover {
            background: rgba(255, 204, 0, 0.08);
            color: #FFCC00;
            border-color: #FFCC00;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .modal h3 {
            margin-bottom: 16px;
            font-size: 1.2rem;
            color: #FFCC00;
        }

        .modal textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            outline: none;
            margin-bottom: 16px;
        }

        .modal textarea:focus {
            border-color: #FFCC00;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .modal-btn.submit {
            background: #FFCC00;
            color: #0d0d14;
        }

        .modal-btn.cancel {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="wrap">

        <div class="hero">
            <h1>Ты действительно хочешь
                это попробовать?</h1>
            <p>Психотерапевт от 5000р, помните об этом перед прослушиванием</p>
        </div>
        <!-- Кнопка вызова модалки -->
        <button class="anon-btn" onclick="openModal()">Добей меня своим сообщением (анонимно)</button>

        <!-- Модальное окно -->
        <div class="modal-overlay" id="anonModal">
            <div class="modal">
                <button class="modal-close" onclick="closeModal()">×</button>
                <h3>Тайное сообщение 🕳️</h3>
                <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 16px;">
                    Никаких имён, IP и следов. Только текст.
                </p>
                <form id="anonForm" action="https://formspree.io/f/mvzevqeg" method="POST">
                    <textarea name="message" placeholder="Напиши что-нибудь..." required></textarea>
                    <!-- Скрытое поле, чтобы Formspree знал, куда перенаправить или что это анонимно -->
                    <input type="hidden" name="_subject" value="Новое анонимное сообщение с сайта!">
                    <div class="modal-actions">
                        <button type="button" class="modal-btn cancel" onclick="closeModal()">Отмена</button>
                        <button type="submit" class="modal-btn submit" id="submitBtn">Отправить в пустоту</button>
                    </div>
                </form>
                <p id="formStatus" style="display:none; text-align:center; margin-top:12px; color:#FFCC00;"></p>
            </div>
        </div>

        <div class="links" id="links"></div>

        <footer>
            <div class="socials">
                <a href="https://t.me/ak_polyanskiy" class="social" target="_blank" rel="noopener">Telegram</a>
                <a href="https://github.com/Alexsandr52" class="social" target="_blank" rel="noopener">GitHub</a>
                <a href="https://music.yandex.ru/playlists/lk.399e40c1-91b5-47b3-82f6-248ba1601728?utm_source=desktop&utm_medium=copy_link"
                    class="social" target="_blank" rel="noopener">Яндекс Музыка</a>
            </div>
            <div class="copyright">Надеюсь, я пойду к психотерапевту в 2026</div>
        </footer>

    </div>

    <script>

        // Управление модальным окном
        function openModal() {
            document.getElementById('anonModal').classList.add('active');
            document.querySelector('.modal textarea').focus();
        }
        function closeModal() {
            document.getElementById('anonModal').classList.remove('active');
        }

        // Закрытие по клику вне окна
        document.getElementById('anonModal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        // Обработка отправки формы без перезагрузки страницы
        document.getElementById('anonForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('formStatus');

            btn.textContent = 'Отправка...';
            btn.disabled = true;

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    form.style.display = 'none';
                    status.textContent = 'Сообщение растворилось в эфире... 👻';
                    status.style.display = 'block';
                    setTimeout(closeModal, 2500);
                } else {
                    throw new Error('Ошибка отправки');
                }
            } catch (error) {
                status.textContent = 'Что-то пошло не так. Попробуй через Telegram.';
                status.style.color = '#FF5E62';
                status.style.display = 'block';
                btn.textContent = 'Отправить в пустоту';
                btn.disabled = false;
            }
        });
        // Массив ссылок (редактируй только этот блок)
        const LINKS = [
            {
                type: 'wave',
                label: 'Волна вместе',
                title: 'Подключись к моей волне',
                desc: 'Как мои дела? Но ведь они вас наебут.',
                url: 'https://music.yandex.ru/multivibe/8f47451a-6ddb-4bd5-8a80-f2e3cae8acbf'
            },
            {
                type: 'playlist',
                label: 'Плейлист',
                title: 'Почему я еще жив',
                desc: 'Треки, которые заходят после полуночи',
                url: 'https://music.yandex.ru/playlists/befda8d2-ca28-765e-bf9a-a69dde91bfb7?utm_source=desktop&utm_medium=copy_link'
            },
            {
                type: 'track',
                label: 'Сейчас слушаю',
                title: 'Whyousolonely, zombiqe — Москва слезам не верит',
                desc: 'На повторе уже третью неделю',
                url: 'https://music.yandex.ru/album/41873674/track/150930968?utm_source=desktop&utm_medium=copy_link'
            }
        ];

        // Рендер ссылок (исправленный)
        const linksEl = document.getElementById('links');
        if (linksEl) {
            linksEl.innerHTML = LINKS.map(l => `
                <a class="card" href="${l.url}" target="_blank" rel="noopener">
                    <div class="card-icon ${l.type}">
                        ${l.type === 'wave' ? '🌊' : l.type === 'playlist' ? '😨' : '💔'}
                    </div>
                    <div class="card-body">
                        <div class="card-type">${l.label}</div>
                        <div class="card-title">${l.title}</div>
                        <div class="card-desc">${l.desc}</div>
                    </div>
                    <div class="card-arrow">›</div>
                </a>
            `).join('');
        }
    </script>

</body>

</html>
